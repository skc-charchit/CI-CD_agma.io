apiVersion: apps/v1
kind: Deployment
metadata:
  name: agma-company-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agma-company-web
  template:
    metadata:
      labels:
        app: agma-company-web
    spec:
      containers:
        - name: web
          image: company-web-image:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
