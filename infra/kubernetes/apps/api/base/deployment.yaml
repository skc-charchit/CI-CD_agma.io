apiVersion: apps/v1
kind: Deployment
metadata:
  name: agma-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agma-api
  template:
    metadata:
      labels:
        app: agma-api
    spec:
      containers:
        - name: api
          image: api-image:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: agma-api-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
